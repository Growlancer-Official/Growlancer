name: Backend Deploy (Supabase)

# Standing rule (founder): backend changes deploy to production in real time,
# same cadence as the frontend (Vercel). Any push touching supabase/** runs:
#   1. Migration drift check — repo migrations must match the live DB exactly
#      (fail-closed: out of sync = no deploy, investigate first)
#   2. supabase db push — applies any pending migrations (no-op when in sync)
#   3. functions deploy — every edge function redeployed from repo source
#      (defaults: verify_jwt honored from config.toml — never loosened here)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zttwsjehcgaicziqyxpq

jobs:
  deploy:
    name: Drift-check → db push → functions deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard — access token present (fail with setup instructions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is missing. One-time setup: Supabase Dashboard → Account → Access Tokens → generate, then add it as the SUPABASE_ACCESS_TOKEN secret in this repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Migration drift check (repo vs live DB — fail-closed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # NOTE: `migration list --output json` is NOT supported by the CLI —
          # it prints a human table. Compare REMOTE-applied versions (column 2)
          # against repo migration files; both sides must match exactly.
          cat > /tmp/driftcheck.mjs << 'EOF'
          import fs from 'fs';
          import { execSync } from 'child_process';
          const ref = process.env.SUPABASE_PROJECT_REF;
          const out = execSync('npx supabase migration list --project-ref ' + ref, {encoding:'utf8', stdio:['ignore','pipe','ignore'], shell:true});
          const remote = new Set();
          for (const line of out.split(/\r?\n/)) {
            if (!line.includes('|')) continue;
            const c = line.split('|').map(s => s.trim().replace(/`/g, ''));
            if (c.length >= 2 && /^\d{6,}$/.test(c[1])) remote.add(c[1]);
          }
          const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql') && f !== 'README.md');
          const fileVersions = new Set(files.map(f => f.match(/^(\d{6,})/)?.[1]).filter(Boolean));
          const remoteOnly = [...remote].filter(v => !fileVersions.has(v));
          const localOnly = [...fileVersions].filter(v => !remote.has(v));
          console.log('files:', files.length, '| remote-applied:', remote.size);
          if (remoteOnly.length) for (const v of remoteOnly) console.error('::error::remote-only migration (in DB, missing from repo): ' + v);
          if (localOnly.length) for (const v of localOnly) console.error('::error::local-only migration (in repo, never applied to DB): ' + v);
          if (remoteOnly.length || localOnly.length) { console.error('::error::migration drift detected — resolve with `supabase migration fetch` or a new migration BEFORE deploying'); process.exit(1); }
          console.log('Migration drift: NONE — repo and live DB in sync.');
          EOF
          node /tmp/driftcheck.mjs

      - name: Apply pending migrations (db push — no-op when in sync)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy all edge functions from repo source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          failed=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then continue; fi
            echo "::group::deploy $name"
            if ! npx supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::error::functions deploy failed: $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
