name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  element-audit:
    name: Element audit (375/768/1280)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # element-audit.mjs uses playwright-core with a system Chrome. Ubuntu
      # runners ship Chrome via this action's install step.
      - name: Install Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/chrome-for-testing"

      - name: Build + serve production artifact
        run: |
          npm run build
          PORT=4174 node server.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4174/ >/dev/null || (echo "server did not start" && exit 1)

      - name: Run element audit (all groups, logged out)
        env:
          E2E_CHROME_PATH: ${{ runner.home }}/.cache/chrome-for-testing/chrome-linux64/chrome
        run: |
          set -o pipefail
          node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=public
          node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=auth
          node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=dashboard
          node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=client
          node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=admin

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-audit-results
          path: tests/e2e-artifacts/
          retention-days: 14
