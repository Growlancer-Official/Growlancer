name: CI — Regression Guard + Element Audit

# Runs on every push to main and every pull request.
# Purpose: catch regressions (TypeScript, lint, build, white-screen guard,
# element-level UI defects) BEFORE they reach production. If this workflow is
# red, the deployment must NOT happen.
#
# Merge history: this file merges the original regression guard (typecheck,
# lint, build with placeholder VITE_* envs — see commit before 8e75814) with
# the element-audit job introduced in 8e75814. npm install is used instead of
# npm ci deliberately: npm ci fails on the Actions runner for this React 19
# lockfile while npm install (Vercel's install path) succeeds.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Node 24 matches the local dev toolchain.
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint

  build:
    name: Unit tests + Production build (+ white-screen guard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        # VITE_* placeholders satisfy the non-empty check in src/lib/supabase.ts
        # at import time (unit tests import the client). Real values are injected
        # by Vercel at deploy time; tests never make live Supabase calls.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
          VITE_APP_VERSION: 0.0.1
        run: npm test
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
          VITE_APP_VERSION: 0.0.1
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  element-audit:
    name: Element audit (375/768/1280)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [typecheck, lint, build]
    # E2E_* secrets enable the authenticated pass below; empty string = not
    # set (fork PRs / before setup) and the guarded steps self-skip.
    env:
      E2E_FREELANCER_EMAIL: ${{ secrets.E2E_FREELANCER_EMAIL }}
      E2E_FREELANCER_PASSWORD: ${{ secrets.E2E_FREELANCER_PASSWORD }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      # element-audit.mjs uses playwright-core + a real Chrome binary.
      - name: Install Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/chrome-for-testing"

      # Build here (not via artifact download) so server.js has dist/ on disk.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
          VITE_APP_VERSION: 0.0.1
        run: npm run build

      - name: Serve production build
        run: |
          PORT=4174 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4174/ >/dev/null || (echo "server did not start" && cat server.log && exit 1)

      # Strict mode: any Section-1 finding fails CI. Uses the build artifact
      # from the build job so the audited bundle is exactly what passed tests.
      - name: Run element audit (all groups, strict)
        env:
          E2E_CHROME_PATH: ${{ runner.home }}/.cache/chrome-for-testing/chrome-linux64/chrome
        run: |
          set -o pipefail
          for group in public auth dashboard client admin; do
            # concurrency=2: 4 parallel Chrome contexts exhaust the 2-4 vCPU
            # runner and cause navigation-timeout flakes; 2 is stable there.
            node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=$group --strict --concurrency=2
          done

      # Authenticated element audit + logout/back-button security. Runs only
      # when the E2E_* repo secrets exist (absent on fork PRs). login.mjs
      # writes storage states to .e2e/ (gitignored); each audit group uses the
      # matching role's storage so protected pages render logged-in.
      - name: Authenticated audit + logout security (freelancer/client/admin)
        if: ${{ env.E2E_FREELANCER_EMAIL != '' }}
        env:
          E2E_CHROME_PATH: ${{ runner.home }}/.cache/chrome-for-testing/chrome-linux64/chrome
        run: |
          set -o pipefail
          node scripts/e2e/login.mjs --base=http://127.0.0.1:4174 --all
          if [ -f .e2e/freelancer.json ]; then
            node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=dashboard --strict --concurrency=2 --storage=.e2e/freelancer.json
          fi
          if [ -f .e2e/client.json ]; then
            node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=client --strict --concurrency=2 --storage=.e2e/client.json
          fi
          if [ -f .e2e/admin.json ]; then
            node scripts/e2e/element-audit.mjs --base=http://127.0.0.1:4174 --group=admin --strict --concurrency=2 --storage=.e2e/admin.json
          fi
          for role in freelancer client admin; do
            if [ -f .e2e/$role.json ]; then
              node scripts/e2e/logout-flow.mjs --base=http://127.0.0.1:4174 --role=$role
            fi
          done

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-audit-results
          path: tests/e2e-artifacts/
          retention-days: 14
