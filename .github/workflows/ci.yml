name: CI — Regression Guard

# Runs on every push to main and every pull request.
# Purpose: catch regressions (TypeScript errors, lint errors, build failures,
# white-screen guard trips) BEFORE they reach production. If this workflow is
# red, the deployment must NOT happen. Errors that were once fixed stay fixed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 matches the local dev toolchain.
          node-version: 24
          cache: npm
      # Use npm install (NOT npm ci) — exactly what Vercel runs, so CI guards
      # the same install path as production. npm ci fails on the Actions runner
      # for this React 19 lockfile while npm install (Vercel's path) succeeds.
      - run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint

  build:
    name: Production build (+ white-screen guard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Production build
        # VITE_* env vars are only required to satisfy the non-empty check in
        # src/lib/supabase.ts during prerender — real values are injected by
        # Vercel at deploy time.
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
          VITE_APP_VERSION: 0.0.1
