# Supabase Check (Pull Requests)
# Runs on every PR that touches supabase/. Catches SQL errors / migration-order
# problems BEFORE they reach main, using `db push --dry-run` (read-only - never
# applies changes to the live database).
#
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN   - Supabase personal access token (dashboard -> Account -> Access Tokens)
#   SUPABASE_PROJECT_REF    - "zttwsjehcgaicziqyxpq" (main Growlancer project)
#   SUPABASE_DB_PASSWORD    - Postgres password of the linked project
#
# NOTE: on PRs from forks, secrets are NOT passed to this workflow (GitHub
# safety), so the dry-run will fail. The repo is private; for same-repo PRs it
# works. Set the dry-run to optional if you ever accept fork PRs.

name: Supabase Check

on:
  pull_request:
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  db-migration-dry-run:
    name: DB migrations - dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry-run migrations (no changes applied)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
