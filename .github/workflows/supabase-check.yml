name: Supabase Check

# Dry-runs supabase db push on PRs that touch supabase/ — catches SQL errors
# before merge without applying anything.

on:
  pull_request:
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Migration dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dry-run migrations
        # --include-all: handles backfilled migrations with older timestamps
        run: supabase db push --dry-run --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
