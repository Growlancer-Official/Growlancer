# Supabase Deploy (main)
# Runs on push to main when supabase/ changed. Deploys all edge functions and
# applies pending migrations to the live project.
#
# DB SAFETY GATE - the migration step only APPLIES when the GitHub repo
# variable `SUPABASE_DB_AUTO_PUSH` equals "true". Until then it runs
# `db push --dry-run` and reports the pending list (nothing changes).
#   -> Set the variable ONLY after the one-time migration-drift reconciliation
#      documented in DEPLOYMENT.md is complete.
#
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN   - Supabase personal access token
#   SUPABASE_PROJECT_REF    - "zttwsjehcgaicziqyxpq" (main Growlancer project)
#   SUPABASE_DB_PASSWORD    - Postgres password of the linked project
# Required GitHub variable:
#   SUPABASE_DB_AUTO_PUSH   - "true" to auto-apply migrations (see above)
#
# Ordering with CI: enable GitHub branch protection on `main` requiring the
# `CI - Regression Guard` checks to pass. All pushes to main are then merges
# that already passed CI, so this workflow can deploy directly.

name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false   # never kill an in-flight deploy

jobs:
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        # v3 required: setup-cli@v1 is deprecated and fails to install the CLI on
        # Node 20+ GitHub runners (caused the recurring 8-9s 'Supabase Deploy'
        # failures). v3 uses a modern Node runtime and installs the CLI correctly.
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify required secrets
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is NOT set - add it in GitHub repo Settings -> Secrets and variables -> Actions (create a token at supabase.com/dashboard -> Account -> Access Tokens)}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF secret is NOT set - add it (value: zttwsjehcgaicziqyxpq)}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy all edge functions
        # NOTE: no `--all` flag in this CLI version — omitting the function name deploys all.
        # `--use-api` bundles server-side (no Docker on the runner) — faster and more reliable in CI.
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  migrate-db:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        # v3 required: setup-cli@v1 is deprecated and fails to install the CLI on
        # Node 20+ GitHub runners (caused the recurring 8-9s 'Supabase Deploy'
        # failures). v3 uses a modern Node runtime and installs the CLI correctly.
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify required secrets
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is NOT set - add it in GitHub repo Settings -> Secrets and variables -> Actions (create a token at supabase.com/dashboard -> Account -> Access Tokens)}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF secret is NOT set - add it (value: zttwsjehcgaicziqyxpq)}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD secret is NOT set - required to connect to the production database}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations (gated) or dry-run
        shell: bash
        run: |
          if [ "${{ vars.SUPABASE_DB_AUTO_PUSH }}" = "true" ]; then
            echo "::notice::SUPABASE_DB_AUTO_PUSH=true - applying migrations to production."
            supabase db push --yes
          else
            echo "::notice::SUPABASE_DB_AUTO_PUSH is not 'true' - DRY-RUN only (no changes applied)."
            echo "::notice::Set the repo variable to 'true' after migration-drift reconciliation (DEPLOYMENT.md)."
            # Gated mode is informational: surface migration drift as a warning but do NOT
            # block the deploy pipeline. Drift is reconciled deliberately (DEPLOYMENT.md sec 4),
            # never auto-applied - especially the pending category reseed / auth migrations.
            supabase db push --dry-run \
              || echo "::warning::db push dry-run blocked by migration drift (remote/local history mismatch). Reconcile per DEPLOYMENT.md sec 4 before flipping SUPABASE_DB_AUTO_PUSH."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
