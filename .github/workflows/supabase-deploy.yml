name: Supabase Deploy

# Deploys edge functions and (optionally) pushes migrations on push to main.
# Migrations are gated by the SUPABASE_DB_AUTO_PUSH GitHub variable — keep it
# false until migration-drift reconciliation is complete (see DEPLOYMENT.md §4).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false  # never cancel a mid-deploy

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        run: supabase functions deploy --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations (gated)
        if: vars.SUPABASE_DB_AUTO_PUSH == 'true'
        # --include-all: applies out-of-order backfilled migrations (e.g. a file
        # with an older timestamp that was added after newer ones were applied).
        # --yes: auto-confirms the "push these migrations?" prompt so CI doesn't hang.
        run: supabase db push --include-all --yes 2>&1 | tee /tmp/migration-push.log; exit ${PIPESTATUS[0]}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-push-log
          path: /tmp/migration-push.log
          if-no-files-found: ignore

      - name: Migration status (always run)
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
